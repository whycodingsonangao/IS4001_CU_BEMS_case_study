[server]
port = 8501
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # hides the Deploy button
showSidebarNavigation = true

[theme]
base = "light"
primaryColor = "#0f9d6e"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
showWidgetBorder = true
baseRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#f0efec"

[theme.dark]
primaryColor = "#1baf7a"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#1a1a19"
